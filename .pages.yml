media:
  input: media
  output: media
  rename: safe
  categories: [image, document]

content:
  - name: site
    label: Website content
    type: file
    path: content/site.json
    format: json
    fields:
      - name: brand
        label: Website name
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: logo
        label: Header logo
        type: image
      - name: favicon
        label: Browser tab icon
        type: image
      - name: hero
        label: Homepage introduction
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: title, label: Main heading, type: text }
          - { name: intro, label: Introduction, type: text }
          - name: images
            label: Introduction images (square gallery, 3-second rotation)
            type: object
            list: true
            fields:
              - { name: image, label: Image, type: image }
              - { name: imageAlt, label: Image description, type: string }
      - name: about
        label: About the consortium
        type: object
        fields:
          - { name: intro, label: Introduction, type: text }
          - name: history
            label: History paragraphs
            type: text
            list: true
          - name: vision
            label: Vision paragraphs
            type: text
            list: true
          - { name: videoUrl, label: Vision video URL (YouTube), type: string }
          - { name: videoLabel, label: Video button text, type: string }
      - name: members
        label: Consortium members
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - { name: name, label: Organisation, type: string }
          - { name: initials, label: Bubble initials (image fallback), type: string }
          - { name: image, label: Member bubble image (optional), type: image }
          - { name: imageAlt, label: Image description, type: string }
          - { name: description, label: Description, type: text }
          - { name: url, label: Website address, type: string }
      - name: why
        label: Why this matters
        type: object
        fields:
          - { name: petsTitle, label: Pets heading, type: string }
          - { name: pets, label: Role of pets, type: text }
          - { name: problemTitle, label: Problem heading, type: string }
          - { name: problem, label: The problem, type: text }
          - { name: quote, label: Quote, type: text }
      - name: goodPractice
        label: Good practice hub
        type: object
        fields:
          - { name: intro, label: Introduction, type: text }
          - name: resources
            label: Hub resources and charters
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: type, label: Type (e.g. resource or charter), type: string }
              - { name: title, label: Title, type: string }
              - { name: description, label: Description, type: text }
              - name: links
                label: Links (up to 2)
                type: object
                list:
                  max: 2
                fields:
                  - { name: text, label: Link text, type: string }
                  - { name: url, label: Link URL, type: string }
              - { name: image, label: Image (optional), type: image }
              - { name: imageAlt, label: Image description, type: string }
      - name: newsEvents
        label: News & events cards
        type: object
        list:
          min: 1
          max: 6
          collapsible:
            collapsed: true
            summary: "{kind}: {title}"
        fields:
          - { name: kind, label: Card type, type: string }
          - { name: date, label: Date or label, type: string }
          - { name: title, label: Card heading, type: string }
          - { name: description, label: Card text, type: text }
          - { name: image, label: Image (optional), type: image }
          - { name: imageAlt, label: Image description, type: string }
          - { name: linkText, label: Link text (optional), type: string }
          - { name: linkUrl, label: Link URL (optional), type: string }
      - name: collaboration
        label: Get involved
        type: object
        fields:
          - { name: impact, label: IMPACT collaboration, type: text }
          - { name: intro, label: Invitation, type: text }
          - { name: partners, label: Organisations and partners, type: text }
          - { name: livedExperience, label: People with lived experience, type: text }
      - name: contact
        label: Contact details
        type: object
        fields:
          - { name: message, label: Contact message, type: text }
          - { name: email, label: Email address, type: string }
          - { name: socialUrl, label: Social media link, type: string }
          - name: images
            label: Contact images (circle gallery, 3-second rotation)
            type: object
            list: true
            fields:
              - { name: image, label: Image, type: image }
              - { name: imageAlt, label: Image description, type: string }
      - name: theme
        label: Theme colours
        type: object
        fields:
          - { name: background, label: Page background (hex), type: string }
          - { name: surface, label: Card background (hex), type: string }
          - { name: alternateBackground, label: Section background (hex), type: string }
          - { name: text, label: Main text (hex), type: string }
          - { name: mutedText, label: Supporting text (hex), type: string }
          - { name: teal, label: Teal accent (hex), type: string }
          - { name: darkTeal, label: Dark teal (hex), type: string }
          - { name: amber, label: Amber accent (hex), type: string }
          - { name: coral, label: Coral accent (hex), type: string }
          - { name: border, label: Border (hex), type: string }
          - { name: heroStart, label: Introduction gradient start (hex), type: string }
          - { name: heroMiddle, label: Introduction gradient middle (hex), type: string }
          - { name: heroEnd, label: Introduction gradient end (hex), type: string }

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "content: add {filename}"
      update: "content: update {filename}"
      delete: "content: remove {filename}"
